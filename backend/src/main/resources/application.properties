spring.application.name=OnlineExamSystem

# Local MySQL Database configuration
spring.datasource.url=jdbc:mysql://localhost:3306/online_exam_system
spring.datasource.username=root
spring.datasource.password=minnuits.
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Uncomment below and comment above to use H2 in-memory instead
# spring.datasource.url=jdbc:h2:mem:online_exam_system;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
# spring.datasource.driver-class-name=org.h2.Driver
# spring.datasource.username=sa
# spring.datasource.password=
# spring.h2.console.enabled=true
# spring.h2.console.path=/h2-console

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Surface real error messages to the frontend (e.g. "Invalid Email or Password")
server.error.include-message=always
server.error.include-binding-errors=always
